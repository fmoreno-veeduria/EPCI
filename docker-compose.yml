name: eficiencia

services:
  eficiencia:
    image: mysql:8.0
    container_name: eficiencia
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --secure-file-priv=/seed
      --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: eficiencia_root
      MYSQL_DATABASE: eficiencia
      MYSQL_USER: eficiencia
      MYSQL_PASSWORD: eficiencia
      TZ: America/Bogota
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql   # datos de MySQL dentro del proyecto (se copian con la carpeta)
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/seed:/seed   # sin :ro, el entrypoint de MySQL hace chown de secure-file-priv
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ueficiencia -peficiencia --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # Sitio público: portada + módulo «Aprende con Tula» + módulo «Explora la encuesta».
  # Lee solo las vistas v_pub_* con un usuario de solo lectura.
  web:
    build: ./web
    container_name: eficiencia-web
    restart: unless-stopped
    environment:
      DB_HOST: eficiencia
      DB_PORT: "3306"
      DB_NAME: eficiencia
      DB_USER: web_publico
      DB_PASSWORD: web_publico
      DB_ADMIN_USER: web_admin
      DB_ADMIN_PASSWORD: web_admin
      ADMIN_RUTA: /acceso-veeduria-k7q2x9   # URL oculta del login de administración (no se enlaza en el sitio)
      CARGADOR_URL: http://cargador:8000
      CARGA_TOKEN: ${CARGA_TOKEN:-cambia-este-token-de-carga}   # secreto compartido con el cargador; defínelo en un .env
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      eficiencia:
        condition: service_healthy

  # Cargador de años de encuesta: recibe el Excel que sube un administrador (servicio interno, sin puerto publicado).
  cargador:
    build: ./cargador
    container_name: eficiencia-cargador
    restart: unless-stopped
    environment:
      DB_HOST: eficiencia
      DB_PORT: "3306"
      DB_NAME: eficiencia
      DB_USER: web_carga
      DB_PASSWORD: web_carga
      CARGA_TOKEN: ${CARGA_TOKEN:-cambia-este-token-de-carga}
    depends_on:
      eficiencia:
        condition: service_healthy

  # Tablero interno de gráficas sobre las vistas v_g_* (el sitio público es «web»).
  dashboard:
    build: ./dashboard
    container_name: eficiencia-dashboard
    restart: unless-stopped
    environment:
      DB_HOST: eficiencia
      DB_NAME: eficiencia
      DB_USER: eficiencia
      DB_PASSWORD: eficiencia
    ports:
      - "8090:8080"
    depends_on:
      eficiencia:
        condition: service_healthy

